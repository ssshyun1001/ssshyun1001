<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Seohyun Yun - Data Science and Machine Learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="0.55" stop-color="#2d4a6b"/>
      <stop offset="1" stop-color="#3a7d8c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- decorative bar chart -->
  <g fill="#ffffff" fill-opacity="0.10">
    <rect x="800" y="150" width="46" height="70" rx="4"/>
    <rect x="862" y="120" width="46" height="100" rx="4"/>
    <rect x="924" y="90" width="46" height="130" rx="4"/>
    <rect x="986" y="130" width="46" height="90" rx="4"/>
    <rect x="1048" y="60" width="46" height="160" rx="4"/>
  </g>
  <!-- decorative trend line -->
  <polyline points="790,170 870,130 940,105 1010,140 1071,70 1130,45" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="870" cy="130" r="5"/>
    <circle cx="940" cy="105" r="5"/>
    <circle cx="1010" cy="140" r="5"/>
    <circle cx="1071" cy="70" r="5"/>
    <circle cx="1130" cy="45" r="5"/>
  </g>

  <text x="70" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Seohyun Yun</text>
  <text x="72" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#d6e6ee" letter-spacing="1.5">Data Science  ·  Machine Learning  ·  RAG</text>
